name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
      EARTHLY_CONVERSION_PARALLELISM: "5"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: earthly/actions/setup-earthly@fb998b3dbcf877575a8f9c1897dd64efb9564176  # v1
        with:
          version: latest
      - name: Run Earthly tests
        run: earthly +test
