name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
      EARTHLY_CONVERSION_PARALLELISM: "5"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: earthly/actions/setup-earthly@fb998b3dbcf877575a8f9c1897dd64efb9564176  # v1
        with:
          version: latest
      - name: Run Earthly tests
        run: earthly +test
