name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
      EARTHLY_CONVERSION_PARALLELISM: "5"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: earthly/actions/setup-earthly@fb998b3dbcf877575a8f9c1897dd64efb9564176  # v1
        with:
          version: latest
      - name: Run Earthly tests
        run: earthly +test
